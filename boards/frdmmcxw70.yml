name: 'FRDM-MCXW70'
display_name: 'MCX W70 FRDM Development Board for Bluetooth LE, IEEE 802.15.4, Thread, Matter and Zigbee'
overview: '<p>The FRDM-MCXW70 is a compact and scalable development board for rapid prototyping of the MCX W70 wireless MCU. It offers easy evaluation of the MCX W70''s multiprotocol wireless support for Bluetooth LE, Zigbee, Thread and Matter.</p><p>The board includes an on-board MCU-Link debugger, industry standard headers for easy access to the MCU’s I/Os, an accelerometer, a light sensor and external SPI flash memory. </p><p>The MCX W70 highly sensitive, optimized 2.4 GHz radio features a PCB meandered-antenna which can be bypassed to test via µ-RF connection.</p><p> Multiple add-on boards are available through NXP''s Expansion Board Hub while the Application Code Hub&nbsp; provides ready to use software examples as part of the MCUXpresso Developer Experience.</p>'
