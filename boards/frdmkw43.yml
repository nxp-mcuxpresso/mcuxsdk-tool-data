name: 'FRDM-KW43'
display_name: 'KW43 FRDM Development Board for Bluetooth LE'
overview: '<p>The FRDM-KW43 is a compact and scalable development board for rapid prototyping of the KW43 wireless MCU.&nbsp;It offers exhaustive evaluation of KW43 MCUs with 2.4 GHz Bluetooth Low Energy and generic FSK wireless connectivity and CAN/LIN connectivity.</p><p>The board includes an on-board MCU-Link debugger, industry standard headers for easy access to the MCU’s I/Os, an accelerometer, a light sensor and external SPI flash memory.</p><p>The KW43 highly sensitive, optimized 2.4 GHz radio features a PCB meandered-antenna which can be bypassed to test via µ-RF connection.&nbsp;</p><p>Multiple add-on boards are available through NXP''s Expansion Board Hub while the Application Code Hub&nbsp; provides ready to use software examples as part of the MCUXpresso Developer Experience.</p>'
